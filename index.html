:root{--sand:#f6f0e6;--paper:#fffdf9;--ink:#1d2733;--mute:#6b6f73;--line:#e7dccb;--coral:#ef6a4c;--coral-d:#d9553a;--sea:#1f6f78}
*{box-sizing:border-box;min-width:0}
html{color-scheme:light}
body{margin:0;background:var(--sand);color:var(--ink);font:17px/1.6 Heebo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:auto;padding:0 20px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 8px}
.brand b{font-family:Karantina,Heebo,sans-serif;font-weight:700;font-size:28px;line-height:1}
.brand span{color:var(--mute);font-size:15px}
.brand i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--coral);margin-inline-end:8px;font-style:normal}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-areas:"frame intro" "frame card";column-gap:clamp(24px,4vw,56px);row-gap:8px;align-content:center;padding:18px 0 40px}
.frame{grid-area:frame;align-self:center}.intro{grid-area:intro;align-self:end}.hero .card{grid-area:card;align-self:start}
@media(max-width:820px){.hero{grid-template-columns:minmax(0,1fr);grid-template-areas:"intro" "frame" "card";row-gap:22px}}
.frame{background:var(--paper);padding:12px;border-radius:22px;box-shadow:0 1px 0 var(--line),0 24px 50px -24px rgba(29,39,51,.35);transform:rotate(-1deg)}
.frame canvas{width:100%;height:auto;display:block;border-radius:14px}
@media(prefers-reduced-motion:no-preference){.frame{transition:transform .4s ease}.frame:hover{transform:rotate(0)}}
h1{font-family:Karantina,Heebo,sans-serif;font-weight:700;font-size:clamp(60px,9vw,104px);line-height:.85;margin:0 0 16px;text-wrap:balance}
.when{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;margin:0 0 18px}
.when::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sea)}
.when.today::before{background:var(--coral);box-shadow:0 0 0 4px rgba(239,106,76,.2)}
.lead{color:var(--mute);margin:0 0 26px;max-width:42ch}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px}
h2{font-family:Karantina,Heebo,sans-serif;font-weight:700;font-size:38px;line-height:1;margin:0 0 8px}
.sub p{margin:0 0 16px;color:var(--mute);font-size:16px}
form{display:flex;gap:8px;flex-wrap:wrap}
#em{flex:1 1 220px;font:inherit;font-size:17px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);min-height:52px;text-align:right}
#em:focus-visible{outline:none;border-color:var(--sea);box-shadow:0 0 0 4px rgba(31,111,120,.15)}
#em[aria-invalid=true]{border-color:var(--coral)}
.join{flex:0 0 auto;font-family:Heebo,sans-serif;font-weight:700;font-size:17px;border:0;border-radius:14px;background:var(--coral);color:#fff;padding:0 22px;min-height:52px;cursor:pointer;transition:background .2s}
.join:hover{background:var(--coral-d)}.join:focus-visible{outline:3px solid var(--sea);outline-offset:2px}.join:disabled{opacity:.6}
.ok{margin:12px 0 0!important;color:var(--ink)!important;background:#fbe9e2;border-radius:12px;padding:10px 14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.month{padding:8px 0 48px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.hint{color:var(--mute);font-size:14px;margin:0}
.mwrap{overflow-x:auto;border-radius:18px;background:var(--paper);padding:10px;border:1px solid var(--line);cursor:zoom-in}
.mwrap img{display:block;width:100%;height:auto;border-radius:10px}.mwrap.zoom{cursor:zoom-out}.mwrap.zoom img{width:240%;max-width:none}
section[hidden],.card[hidden]{display:none}
footer{border-top:1px solid var(--line);padding:20px 0 36px;color:var(--mute);font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer a{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><b><i></i>מועדון הנוער עופר</b><span>ראשון ורביעי</span></div>
  <section class="hero">
    <div class="frame"><canvas id="cv" width="1320" height="1868" role="img" aria-label="לו״ז הפעילות הבאה במועדון הנוער"></canvas></div>
    <div class="intro">
      <h1>מה קורה במועדון</h1>
      <p class="when" id="when"></p>
      <p class="lead" id="lead">הלו״ז מתעדכן לבד לפעילות הבאה, מיד כשהקודמת נגמרת. רוצים שזה יגיע אליכם? השאירו מייל.</p>
    </div>
      <section class="card sub">
        <h2>תזכורת במייל</h2>
        <p>ערב לפני כל פעילות ובצהריים של היום עצמו. בלי ספאם, ואפשר להסיר בכל רגע.</p>
        <form id="subf" novalidate>
          <label for="em" class="sr">כתובת מייל</label>
          <input id="em" type="email" inputmode="email" autocomplete="email" placeholder="המייל שלכם" required dir="ltr">
          <button class="join" type="submit">הרשמה</button>
        </form>
        <p id="subok" class="ok" hidden></p>
      </section>
  </section>
  <section class="month" id="msec" hidden>

    <div class="mwrap" id="mwrap"><img id="mimg" alt=""></div>
  </section>
  <footer><span>אורי, רכז מועדון הנוער · <a href="tel:0587747007" dir="ltr">058-7747007</a></span><span>מושב עופר</span></footer>
</div>

  const d=new Date(now.date);
  if(isAct(d)&&!CANCELLED[key(d)]&&now.hm<SWITCH_AT)return d;
  for(let i=0;i<60;i++){d.setUTCDate(d.getUTCDate()+1);if(isAct(d)&&!CANCELLED[key(d)])return d}
  return null;
}
const img=new Image();img.src=BASE;
async function poster(d){
  try{await document.fonts.load('94px GL','אבג 0123:.-')}catch(e){}
  if(!img.complete)await new Promise(r=>img.onload=r);
  const c=$('cv').getContext('2d');c.drawImage(img,0,0);c.fillStyle='#fff';c.textBaseline='alphabetic';
  c.direction='rtl';c.textAlign='center';c.font=L.daySize+'px GL';c.fillText(DAYS[d.getUTCDay()],L.dayX,L.dayBase);
  c.direction='ltr';c.font=L.numSize+'px GL';c.fillText(d.getUTCDate()+'.'+(d.getUTCMonth()+1),L.dateX,L.dayBase);
  ROWS.forEach((r,i)=>{
    const lab=r[0]+':',tm=r[1]+'-'+r[2];
    c.direction='rtl';c.font=L.labSize+'px GL';const wl=c.measureText(lab).width;
    c.direction='ltr';c.font=L.numSize+'px GL';const wt=c.measureText(tm).width*L.sx;
    const k=Math.min(1,900/(wl+L.gap+wt)),tot=(wl+L.gap+wt)*k,right=L.cx+tot/2,y=L.rowsBase[i];
    c.save();c.translate(right,y);c.scale(k,1);c.direction='rtl';c.textAlign='right';c.font=L.labSize+'px GL';c.fillText(lab,0,0);c.restore();
    c.save();c.translate(right-tot,y);c.scale(k*L.sx,1);c.direction='ltr';c.textAlign='left';c.font=L.numSize+'px GL';c.fillText(tm,0,0);c.restore();
  });
  const ex=EXTRA[key(d)];
  if(ex){c.direction='rtl';c.textAlign='center';let s=110;c.font=s+'px GL';while(c.measureText(ex).width>820&&s>50){s-=4;c.font=s+'px GL'}c.fillText(ex,600,L.extraBase)}
}
function month(now){
  let d=now.date,k=d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1),src=MONTHLY[k];
  if(!src){d=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1));k=d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1);src=MONTHLY[k]}
  if(!src){$('msec').hidden=true;return}
  if($('mimg').dataset.k!==k){$('mimg').src=src;$('mimg').dataset.k=k;$('mimg').alt='לוח הפעילות של '+MONTHS[d.getUTCMonth()];}
  $('mtitle').textContent='הלו״ז של '+MONTHS[d.getUTCMonth()];$('msec').hidden=false;
}
$('mwrap').addEventListener('click',()=>{$('mwrap').classList.toggle('zoom')});
function render(){
  const now=israelNow(),next=nextActivity(now);
  if(next){poster(next);
    const today=key(next)===key(now.date);
    const dd=DAYS[next.getUTCDay()]+' '+next.getUTCDate()+'.'+(next.getUTCMonth()+1);
    $('when').textContent=today?'היום, '+dd+' · מחכים לכם':'הפעילות הבאה: '+dd;$('when').classList.toggle('today',today);}
  month(now);
}
const FORM_POST='https://docs.google.com/forms/d/e/1FAIpQLSeDeo5wKAUTsDqkGkuc2dc8-W1LQosiUccy2Fyprxc5uCMzkA/formResponse';
const FORM_FIELD='entry.2039579549';
if(!FORM_POST){document.querySelector('.hero .card').hidden=true;$('lead').textContent='הלו״ז מתעדכן לבד לפעילות הבאה, מיד כשהקודמת נגמרת.'}
$('subf').addEventListener('submit',async e=>{e.preventDefault();const v=$('em').value.trim();
  const ok=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);$('em').setAttribute('aria-invalid',!ok);$('subok').hidden=false;
  if(!ok){$('subok').textContent='נראה שחסר משהו בכתובת. נסו שוב.';return}
  const btn=$('subf').querySelector('button');btn.disabled=true;btn.textContent='שולח…';
  try{await fetch(FORM_POST,{method:'POST',mode:'no-cors',body:new URLSearchParams({[FORM_FIELD]:v})});
    $('subok').textContent='נרשמתם! התזכורת הראשונה תגיע בערב שלפני הפעילות הבאה.';$('subf').reset();}
  catch(err){$('subok').textContent='משהו לא עבד. בדקו את החיבור לאינטרנט ונסו שוב.'}
  btn.disabled=false;btn.textContent='הרשמה';
});
fetch('schedule.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{
  ACTIVITY_DAYS=j.activityDays||ACTIVITY_DAYS;SWITCH_AT=j.switchAt||SWITCH_AT;ROWS=j.rows||ROWS;
  CANCELLED=j.cancelled||{};EXTRA=j.extra||{};MONTHLY=j.monthly||{};
}).catch(()=>{}).finally(()=>{render();setInterval(render,5*60*1000)});
}
